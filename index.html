<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5E73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="技工物">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%230F5E73'/%3E%3Ctext x='90' y='124' font-size='96' text-anchor='middle'%3E%F0%9F%A6%B7%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%A6%B7%3C/text%3E%3C/svg%3E">
<title>BFL技工物 — 発注・進捗（デモ）</title>
<style>
:root{
  --ground:#F5F4F1;
  --surface:#FFFFFF;
  --surface2:#EDECE8;
  --ink:#22303A;
  --muted:#6E7B85;
  --line:#DDDCD6;
  --accent:#0F5E73;
  --accent-ink:#FFFFFF;
  --danger:#B3402F;
  --warn:#9A6A00;
  --ok:#256D42;
  --chip-ink:#3A4750;
  --shadow:0 1px 2px rgba(34,48,58,.06),0 4px 14px rgba(34,48,58,.05);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#12181C;
    --surface:#1B2329;
    --surface2:#232D34;
    --ink:#E6ECEF;
    --muted:#94A2AC;
    --line:#2E3941;
    --accent:#5BB8CE;
    --accent-ink:#0C2229;
    --danger:#E5806F;
    --warn:#D9A94A;
    --ok:#7CC397;
    --chip-ink:#C7D2D9;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.28);
  }
}
:root[data-theme="light"]{
  --ground:#F5F4F1; --surface:#FFFFFF; --surface2:#EDECE8; --ink:#22303A; --muted:#6E7B85;
  --line:#DDDCD6; --accent:#0F5E73; --accent-ink:#FFFFFF; --danger:#B3402F; --warn:#9A6A00;
  --ok:#256D42; --chip-ink:#3A4750;
  --shadow:0 1px 2px rgba(34,48,58,.06),0 4px 14px rgba(34,48,58,.05);
}
:root[data-theme="dark"]{
  --ground:#12181C; --surface:#1B2329; --surface2:#232D34; --ink:#E6ECEF; --muted:#94A2AC;
  --line:#2E3941; --accent:#5BB8CE; --accent-ink:#0C2229; --danger:#E5806F; --warn:#D9A94A;
  --ok:#7CC397; --chip-ink:#C7D2D9;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.55;
  font-feature-settings:"palt";
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.shell{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--ground);position:relative}
@media (min-width:520px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.top-actions{margin-left:auto;display:flex;gap:4px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:20px;height:20px}
.seg{display:flex;gap:4px;padding:0 16px 10px}
.seg button{flex:1;padding:7px 0;border-radius:9px;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.searchbar{padding:0 16px 10px;display:none}
.searchbar.show{display:block}
.searchbar input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--chip-ink);white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.chip .n{color:var(--muted);font-weight:600}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink)}

/* ---------- main / cards ---------- */
main{flex:1;padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
.section-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em;margin:18px 2px 8px;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.order-card{display:block;width:100%;text-align:left}
.order-card:active{transform:scale(.995)}
.oc-top{display:flex;align-items:baseline;gap:8px}
.oc-name{font-weight:700;font-size:15.5px}
.oc-karte{color:var(--muted);font-size:12.5px}
.oc-no{margin-left:auto;color:var(--muted);font-size:11px}
.status-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#333B41;border:1px solid rgba(0,0,0,.08)}
.oc-items{margin:8px 0 6px;display:flex;flex-direction:column;gap:4px}
.oc-item{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.teeth-tag{background:var(--surface2);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.oc-foot{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.due{font-weight:700;color:var(--ink)}
.badge{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge.late{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.badge.soon{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.badge.conflict{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.badge.rush{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.badge.nocheck{background:var(--surface2);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13.5px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}

/* ---------- detail ---------- */
.back-row{display:flex;align-items:center;gap:6px;padding:10px 10px}
.back-row .title{font-weight:700;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{text-align:right}
.item-block{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--ground)}
.item-block .ib-name{font-weight:700;font-size:14px}
.ib-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted);align-items:center}
.stepper{display:flex;align-items:flex-start;gap:0;margin:10px 0 4px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.step .bub{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);border:2px solid var(--line);position:relative;z-index:1}
.step.done .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.now .bub{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.step .lb{font-size:9.5px;color:var(--muted);text-align:center;line-height:1.25}
.step.now .lb{color:var(--ink);font-weight:700}
.step::before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step.done::before,.step.now::before{background:var(--accent)}
.status-actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px 0;border-radius:11px;font-weight:700;font-size:14px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.danger-ghost{border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger);background:var(--surface)}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:scale(.98)}
.resend-note{margin-top:10px;font-size:12px;color:var(--muted)}
.hist{margin-top:8px;display:flex;flex-direction:column;gap:0}
.hist-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:baseline}
.hist-row:last-child{border-bottom:none}
.hist-row .t{color:var(--muted);flex:0 0 auto}
.alert{display:flex;gap:8px;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:10px;align-items:flex-start}
.alert.warn{background:color-mix(in srgb,var(--warn) 12%,var(--surface));color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line))}
.alert.err{background:color-mix(in srgb,var(--danger) 10%,var(--surface));color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 30%,var(--line))}
.linkline{display:flex;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px;text-decoration:none;color:var(--ink)}
.linkline:last-child{border-bottom:none}
.linkline .arrow{margin-left:auto;color:var(--muted)}
a.linkline:visited{color:var(--ink)}

/* ---------- form ---------- */
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input[type="text"],.field input[type="date"],.field input[type="number"],.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:42px}
.field textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shade-chips,.cat-chips{display:flex;flex-wrap:wrap;gap:6px}
.shade-chips button,.cat-chips button{padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600}
.shade-chips button.on,.cat-chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:4px 0}
.check input{width:19px;height:19px;accent-color:var(--accent)}
.item-card{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;margin-bottom:12px;position:relative}
.item-card .ic-head{display:flex;align-items:center;margin-bottom:10px}
.item-card .ic-head .t{font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em}
.item-card .rm{margin-left:auto;color:var(--danger);font-size:12.5px;font-weight:600;padding:4px 8px}
.add-item{width:100%;padding:13px 0;border:1.5px dashed var(--line);border-radius:var(--radius);color:var(--accent);font-weight:700;font-size:14px;margin-bottom:14px;background:transparent}
.due-preview{margin-top:10px;padding:9px 12px;border-radius:9px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));font-size:13px;display:flex;align-items:baseline;gap:8px}
.due-preview b{font-size:15px}
.due-preview .src{margin-left:auto;font-size:11px;color:var(--muted)}
.sticky-save{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));padding-top:6px;z-index:5;background:linear-gradient(transparent,var(--ground) 40%)}

/* ---------- odontogram ---------- */
.odn{touch-action:pan-y;user-select:none;-webkit-user-select:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px}
.odn-arch{position:relative}
.odn-arch+.odn-arch{margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
.odn-arch::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--line);transform:translateX(-50%)}
.odn-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.odn-grid+.odn-grid{margin-top:4px}
.tooth{min-height:40px;min-width:0;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--ground);position:relative;z-index:1}
.tooth.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* 歯式の種別（BFL希望2）: 記号＋色の両方で区別する */
.tooth .tsym{position:absolute;top:-1px;right:2px;font-size:10px;font-style:normal;line-height:1}
.tooth.tt-implant{background:var(--warn);border-color:var(--warn);color:#fff}
.tooth.tt-abutment{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.tooth.tt-pontic{background:var(--surface);border-color:var(--ink);color:var(--ink);border-width:2px}
.tt-modes{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.tt-modes button{flex:1 1 auto;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}
.tt-modes button.on.m-unit{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tt-modes button.on.m-implant{background:var(--warn);border-color:var(--warn);color:#fff}
.tt-modes button.on.m-abutment{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.tt-modes button.on.m-pontic{background:var(--surface);border-color:var(--ink);color:var(--ink);border-width:2px}
.odn-readout .rt.tt-implant{background:color-mix(in srgb,var(--warn) 22%,var(--surface))}
.odn-readout .rt.tt-abutment{background:color-mix(in srgb,var(--ink) 15%,var(--surface))}
.odn-readout .rt.tt-pontic{background:var(--surface);border:1.5px solid var(--ink)}
.odn-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.08em;padding:0 2px 4px}
.odn-lbl.bottom{padding:4px 2px 0}
.odn-readout{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:26px}
.odn-readout .rt{display:flex;align-items:center;gap:4px;background:var(--surface2);border-radius:7px;padding:3px 8px;font-size:12.5px;font-weight:600}
.odn-readout .rt button{color:var(--muted);font-size:14px;line-height:1;padding:0 1px}
.odn-hint{font-size:11px;color:var(--muted);margin-top:8px}
.odn-clear{font-size:12px;color:var(--accent);font-weight:700;padding:4px 6px}

/* ---------- 納期表 ---------- */
.noki-table{width:100%;border-collapse:collapse;font-size:13px}
.noki-table th,.noki-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.noki-table td:last-child,.noki-table th:last-child{text-align:right;white-space:nowrap}
.noki-table .cat-row td{padding-top:14px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;border-bottom:none}
.naka{color:var(--muted);font-size:11.5px;margin-left:6px}

/* ---------- セット時フィードバック ---------- */
.implant-box{border:1.5px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:10px;padding:11px 12px;margin-bottom:12px;background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.implant-box .ib-head{font-weight:700;font-size:12.5px;color:var(--warn);letter-spacing:.06em;margin-bottom:8px}
/* 径はメーカーのカラーコードで選ぶ（アストラテック EV: 3.0緑 3.6紫 4.2黄 4.8青 5.4茶） */
.dia-chips{display:flex;flex-wrap:wrap;gap:6px}
.dia-chips button{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.dia-chips button .dia-dot{width:13px;height:13px;border-radius:50%;background:var(--dia,var(--muted));border:1px solid rgba(0,0,0,.15)}
.dia-chips button .dia-n{font-size:10.5px;font-weight:600;color:var(--muted)}
.dia-chips button.on{border-color:var(--dia,var(--accent));background:color-mix(in srgb,var(--dia,var(--accent)) 14%,var(--surface))}
.dia-chips button.on .dia-n{color:var(--ink)}
.bfl-box{border:1.5px solid var(--accent);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.bfl-box .bb-head{font-weight:700;font-size:12.5px;color:var(--accent);letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.role-seg{display:flex;gap:4px;padding:0 16px 8px}
.role-seg button{flex:1;padding:6px 0;border-radius:8px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700}
.role-seg button.on{background:var(--ink);color:var(--ground)}
.sortbar{display:flex;gap:6px;padding:0 16px 10px}
.sortbar select{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12.5px;min-height:0}
.rate-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rate-row .rl{width:5.5em;font-size:13px;font-weight:600}
.rate-row .opts{flex:1;display:flex;gap:6px}
.rate-row .opts button{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.rate-row .opts button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate-legend{font-size:10.5px;color:var(--muted);margin:-2px 0 10px;text-align:right}
.fb-view{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;align-items:center}
.fb-view .fb-l{color:var(--muted)}
.fb-dots{letter-spacing:2px;font-weight:700}

/* ---------- 帳票（指示書・保証書）: 印刷前提のため常にライト配色 ---------- */
.doc{background:#fff;color:#1A1A1A;border:1px solid var(--line);border-radius:8px;padding:24px 20px;font-size:13px;line-height:1.7}
.doc h1{font-size:19px;text-align:center;letter-spacing:.35em;text-indent:.35em;margin-bottom:4px;font-weight:700}
.doc .doc-meta{display:flex;justify-content:space-between;font-size:11px;color:#555;margin-bottom:14px}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px;table-layout:fixed}
.doc th,.doc td{border:1px solid #8A8A8A;padding:6px 8px;text-align:left;vertical-align:top;color:#1A1A1A;word-break:break-word;overflow-wrap:anywhere}
.doc th{background:#F1F1EE;font-weight:600;width:6.2em}
.doc .items-tbl th{width:auto}
.doc .items-tbl td.num{white-space:nowrap;word-break:keep-all;overflow-wrap:normal}
.doc .note-box{border:1px solid #8A8A8A;min-height:56px;padding:6px 9px;margin-bottom:12px;white-space:pre-wrap}
.doc .terms{font-size:11px;color:#333;margin:10px 0 14px}
.doc .sig-area{display:flex;gap:12px;align-items:flex-end;margin-top:8px}
.doc .sig-box{flex:1;border:1px dashed #8A8A8A;min-height:88px;display:flex;align-items:center;justify-content:center;color:#999;font-size:11px}
.doc .sig-box img{max-height:80px;max-width:100%}
.doc .issuer{text-align:right;font-size:12px;margin-top:14px}
.warranty{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.doc .fine{font-size:9.5px;color:#333;line-height:1.6;margin:8px 0}
.doc .fine li{margin-left:1.2em;list-style:none;text-indent:-1.2em}
.doc .sec-rule{border:none;border-top:1px solid #8A8A8A;margin:10px 0 6px}
.doc .sec-t{font-size:10.5px;font-weight:700;text-align:center;letter-spacing:.1em;margin:8px 0 4px}
.doc .coel{border-top:2px solid #1A1A1A;margin-top:14px;padding-top:8px;font-size:10.5px;text-align:center;line-height:1.7}
.doc .coel b{font-size:12px;letter-spacing:.05em}
/* 帳票内の歯式（紙の指示書と同じ十字表記）。マスは画面幅に応じて縮む */
.dtc-wrap{margin:2px 0 4px;max-width:400px;margin-left:auto;margin-right:auto}
.dtc-row{display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px}
.dtc-row+.dtc-row{border-top:1.5px solid #555;margin-top:3px;padding-top:3px}
.dtc{flex:1 1 0;min-width:0;max-width:20px;text-align:center;color:#888;font-variant-numeric:tabular-nums;position:relative;padding-top:9px}
.dtc.on{background:#1A1A1A;color:#fff;border-radius:4px;font-weight:700}
.dtc .dsym{position:absolute;top:-1px;left:0;right:0;font-size:9px;font-style:normal;line-height:1;color:#1A1A1A}
.dtc.on .dsym{color:#1A1A1A}
/* 記号つきの種別は塗りつぶさず枠で表す（白黒印刷でも記号が読める） */
.dtc.on.d-implant,.dtc.on.d-pontic{background:#fff;color:#1A1A1A;border:1.5px solid #1A1A1A}
.dtc.on.d-abutment{background:#1A1A1A;color:#fff}
.dtc.on.d-abutment .dsym{color:#1A1A1A}
.dtc-legend{font-size:9.5px;color:#333;text-align:center;margin-top:5px}
.dtc-mid{width:2px;flex:0 0 2px;align-self:stretch;background:#555;margin:0 3px}
.doc-actions{display:flex;gap:8px;margin:12px 0}
#sig-pad{width:100%;height:170px;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
@media print{
  body{background:#fff}
  .top,.nav,.toast,.modal-bg,.no-print,.doc-actions{display:none !important}
  .shell{max-width:none;border:none;min-height:auto}
  main{padding:0}
  .doc{border:none;border-radius:0;padding:8mm 4mm}
}

/* ---------- toast / modal ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;
  background:var(--ink);color:var(--ground);border-radius:11px;padding:11px 14px;display:flex;align-items:center;gap:14px;
  font-size:13.5px;box-shadow:var(--shadow);max-width:min(92vw,400px)}
.toast button{color:color-mix(in srgb,var(--accent) 60%,var(--ground));font-weight:700;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,18,.45);z-index:50;display:grid;place-items:end center}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:430px;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.modal h3{font-size:15.5px;margin-bottom:6px}
.modal p{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.modal .btns{display:flex;gap:8px}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .18s ease-out}
  .modal{animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(14px);opacity:.5}to{transform:translateY(0);opacity:1}}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

// ---------- 日付ユーティリティ ----------
const fmtISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseISO = s => { const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd, 12); };
const WD = ["日","月","火","水","木","金","土"];
function fmtJP(iso, withWd = true) {
  if (!iso) return "—";
  const d = parseISO(iso);
  return `${d.getMonth()+1}/${d.getDate()}${withWd ? `（${WD[d.getDay()]}）` : ""}`;
}
function fmtJPFull(iso) {
  if (!iso) return "—";
  const d = parseISO(iso);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function todayISO() { return fmtISO(new Date()); }
function isBiz(d) { const w = d.getDay(); return w !== 0 && w !== 6 && !LAB_CLOSED.has(fmtISO(d)); }
function shiftDay(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function prevBiz(d) { let x = new Date(d); while (!isBiz(x)) x = shiftDay(x, -1); return x; }
function addBiz(d, n) { let x = new Date(d), c = 0; while (c < n) { x = shiftDay(x, 1); if (isBiz(x)) c++; } return x; }
// 納品日 = 発送日（休業日なら直前の営業日扱い）から中naka営業日空けた翌営業日
function deliveryISO(shipISO, pros, impressionISO) {
  if (!pros) return null;
  if (pros.cal) {
    const base = impressionISO || shipISO;
    return base ? fmtISO(shiftDay(parseISO(base), pros.cal)) : null;
  }
  if (pros.naka == null || !shipISO) return null;
  return fmtISO(addBiz(prevBiz(parseISO(shipISO)), pros.naka + 1));
}
function daysUntil(iso) {
  return Math.round((parseISO(iso) - parseISO(todayISO())) / 86400000);
}

// ---------- ステータス遷移 ----------
function applyStatus(o, to, note) {
  const from = o.status;
  // 自動スタンプ。変更前の値はundoStackへ（JSON保存で消えないようnullで保持）
  const undo = {};
  if (to === 1 || to === 2) {
    undo.shipDate = o.shipDate ?? null;
    if (from === 99) {
      // 再送: 発送日を今日に更新し、前回分のBFL側日付をリセット
      o.shipDate = todayISO();
      for (const k of ["bflArrival", "bflShip", "delivered"]) { undo[k] = o.dates[k] ?? null; o.dates[k] = null; }
    } else if (!o.shipDate) {
      o.shipDate = todayISO();
    }
  }
  const f = STAMP_FIELD[to];
  if (f) { undo[f] = o.dates[f] ?? null; if (!o.dates[f]) o.dates[f] = todayISO(); }
  if (to === 6) {
    undo.warrantyStart = o.warrantyStart ?? null; undo.warrantyEnd = o.warrantyEnd ?? null;
    if (o.items.some(it => PRO[it.prosId]?.sig)) {
      const s = parseISO(o.dates.setDone || todayISO());
      const e = new Date(s); e.setFullYear(e.getFullYear() + 5); e.setDate(e.getDate() - 1);
      o.warrantyStart = fmtISO(s); o.warrantyEnd = fmtISO(e);
    }
  }
  o.status = to;
  const entry = { at: nowStamp(), from, to, by: o.clinic };
  if (note) entry.note = note;
  o.history.push(entry);
  o.undoStack.push({ from, undo });
  save();
}
// 直前の変更を取り消す。履歴は消さず「取り消し」の行として追記する（監査ログを維持）
function undoLast(o, label) {
  const u = o.undoStack.pop();
  if (!u) return false;
  const cur = o.status;
  const ud = u.undo || {};
  if ("shipDate" in ud) o.shipDate = ud.shipDate;
  for (const k of ["bflArrival", "bflShip", "delivered", "setDone"]) if (k in ud) o.dates[k] = ud[k];
  if ("warrantyStart" in ud) { o.warrantyStart = ud.warrantyStart; o.warrantyEnd = ud.warrantyEnd; }
  o.status = u.from;
  o.history.push({ at: nowStamp(), from: cur, to: u.from, by: o.clinic, note: label || "取り消し" });
  save();
  return true;
}
// 既存データ移行: undoStackが無い注文は履歴から復元（スタンプは既定値でクリア）
function defaultUndo(to) {
  const undo = {};
  if (STAMP_FIELD[to]) undo[STAMP_FIELD[to]] = null;
  if (to === 6) { undo.warrantyStart = null; undo.warrantyEnd = null; }
  return undo;
}
function migrate(o) {
  if (!Array.isArray(o.undoStack)) {
    o.undoStack = (o.history || []).filter(h => ST[h.to] && ST[h.from]).map(h => ({ from: h.from, undo: defaultUndo(h.to) }));
  }
  return o;
}

// ---------- 描画: ホーム ----------
function homeFiltered() {
  const q = state.search.trim();
  let orders = db.orders.filter(o => o.clinic === state.clinic);
  if (q) {
    orders = orders.filter(o =>
      o.patient.includes(q) || o.karte.toLowerCase().includes(q.toLowerCase()) || o.no.includes(q));
  }
  if (isBfl() && state.techFilter !== "all") {
    orders = orders.filter(o => (o.technician || "") === (state.techFilter === "none" ? "" : state.techFilter));
  }
  return orders;
}
function homeChipsHTML(orders) {
  const counts = {};
  for (const o of orders) counts[o.status] = (counts[o.status] || 0) + 1;
  // 「全て」は中止を除いた件数（中止は専用チップで確認する）
  const active = orders.filter(o => o.status !== 98).length;
  return [
    `<button class="chip ${state.filter === "all" ? "on" : ""}" data-filter="all">全て <span class="n num">${active}</span></button>`,
    ...STATUSES.map(s =>
      `<button class="chip ${state.filter == s.id ? "on" : ""}" data-filter="${s.id}">
        <span class="dot" style="background:${s.color}"></span>${esc(s.short)} <span class="n num">${counts[s.id] || 0}</span>
      </button>`),
  ].join("");
}
function homeCardsHTML(orders) {
  const shown = state.filter === "all"
    ? orders.filter(o => o.status !== 98)
    : orders.filter(o => o.status === Number(state.filter));
  // BFL希望6: 担当技工士別／BFL納期の早い順で並べられるように
  if (isBfl() && state.sortBy === "tech") {
    shown.sort((a, b) => (a.technician || "￿").localeCompare(b.technician || "￿")
      || String(orderDelivery(a) || "9999").localeCompare(String(orderDelivery(b) || "9999")));
  } else {
    shown.sort((a, b) => {
      const da = orderDelivery(a) || "9999", dbb = orderDelivery(b) || "9999";
      return da < dbb ? -1 : da > dbb ? 1 : 0;
    });
  }

  const cards = shown.map(o => {
    const due = orderDelivery(o);
    const dd = due ? daysUntil(due) : null;
    const late = due && dd < 0 && o.status < 5 && o.status !== 99;
    const soon = due && dd >= 0 && dd <= 3 && o.status < 5 && o.status !== 99;
    const conflict = due && o.apptDate && due > o.apptDate && o.status < 5;
    return `<button class="card order-card" data-open="${o.no}">
      <div class="oc-top">
        <span class="oc-name">${esc(o.patient)}</span>
        <span class="oc-karte num">${esc(o.karte)}</span>
        <span class="oc-no num">${esc(o.no)}</span>
      </div>
      <div class="oc-items">${o.items.map(it => {
        const p = PRO[it.prosId];
        return `<div class="oc-item"><span>${esc(p ? p.name : "?")}</span>${it.teeth.length ? `<span class="teeth-tag">${esc(teethLabel(it))}</span>` : ""}${it.shade ? `<span class="teeth-tag">${esc(it.shade)}</span>` : ""}</div>`;
      }).join("")}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">${statusPill(o.status)}
        ${o.rush ? '<span class="badge rush">⚡ 特急</span>' : ""}
        ${o.drChecked ? "" : '<span class="badge nocheck">Dr未確認</span>'}
      </div>
      <div class="oc-foot">
        <span>納期 <span class="due num">${due ? fmtJP(due) : "BFL設定待ち"}</span></span>
        ${late ? '<span class="badge late">納期超過</span>' : ""}
        ${soon ? '<span class="badge soon">あと' + dd + "日</span>" : ""}
        ${conflict ? '<span class="badge conflict">予約日より後</span>' : ""}
        ${o.apptDate ? `<span>予約 <span class="num">${fmtJP(o.apptDate, false)}</span></span>` : ""}
      </div>
      ${o.technician ? `<div class="oc-foot" style="margin-top:4px"><span>技工士 <b style="color:var(--ink)">${esc(o.technician)}</b></span></div>` : ""}
    </button>`;
  }).join("");
  return shown.length ? cards : '<div class="empty">該当する案件がありません</div>';
}

// ---------- 描画: 詳細 ----------
function viewDetail() {
  const o = findOrder(state.orderNo);
  if (!o) { state.view = "home"; return viewHome(); }
  const s = ST[o.status];
  const due = orderDelivery(o);
  const conflict = due && o.apptDate && due > o.apptDate && o.status < 5;

  const flowSteps = [ST[0], ST[o.history.some(h => h.to === 2) || o.status === 2 ? 2 : 1], ST[3], ST[4], ST[5], ST[6]];
  const curFlow = o.status === 99 ? -1 : ST[o.status].flow;
  const stepper = o.status === 99
    ? `<div class="alert err"><span>⚠️</span><div><b>要再送</b> — ${esc(ST[99].desc)}<br>
        <b>BFLからの連絡:</b> ${esc(o.history.at(-1)?.note || "（記載なし）")}</div></div>`
    : `<div class="stepper">${flowSteps.map((st, i) =>
        `<div class="step ${i < curFlow ? "done" : i === curFlow ? "now" : ""}">
          <div class="bub">${i < curFlow ? "✓" : esc(st.name.slice(0, 1))}</div>
          <div class="lb">${esc(st.short)}</div>

  const opts = nextOptions(o);
  const actions = `

  const items = o.items.map((it, i) => {

// BFLが設定する項目（納品日・担当技工士・申し送り）。BFLモードのときだけ編集できる
function bflPanel(o) {
  const editable = isBfl();
  const arrived = o.status >= 3 && o.status !== 98;
  if (!editable && !o.bflDueDate && !o.technician && !o.bflNote) return "";
  if (editable && !arrived) {
    return `<div class="bfl-box"><div class="bb-head">🔧 BFL設定</div>
      <p style="font-size:12.5px;color:var(--muted);margin:0">③ BFL到着済み になると、納品日・担当技工士・申し送りを設定できます。</p></div>`;
  }
  if (!editable) {
    return `<div class="bfl-box"><div class="bb-head">🔧 BFLからの情報</div>
      <dl class="kv">
        <dt>納品予定日</dt><dd class="num">${o.bflDueDate ? `<b>${fmtJP(o.bflDueDate)}</b>` : "未設定"}</dd>
        <dt>担当技工士</dt><dd>${esc(o.technician || "未割当")}</dd>
      </dl>
      ${o.bflNote ? `<div style="margin-top:10px"><div style="font-size:11px;color:var(--muted)">BFL→Dr セット時の確認事項</div>
        <div style="font-size:13.5px;white-space:pre-wrap;margin-top:3px">${esc(o.bflNote)}</div></div>` : ""}
    </div>`;
  }
  return `<div class="bfl-box"><div class="bb-head">🔧 BFL設定</div>
    <div class="row2">
      <div class="field" style="margin-bottom:10px"><label>納品日（出し日）</label>
        <input type="date" id="b-due" value="${esc(o.bflDueDate || "")}"></div>
      <div class="field" style="margin-bottom:10px"><label>担当技工士</label>
        <select id="b-tech"><option value="">未割当</option>
          ${TECHNICIANS.map(t => `<option ${o.technician === t ? "selected" : ""}>${esc(t)}</option>`).join("")}
        </select></div>
    </div>
    <div class="field" style="margin-bottom:0"><label>BFL→Dr　セット時の確認事項</label>
      <textarea id="b-note" placeholder="コンタクトを強めにしてあります／咬合の調整をお願いします など">${esc(o.bflNote || "")}</textarea></div>
    ${o.chargeable ? `<p style="font-size:12px;color:var(--warn);margin-top:8px">⚠️ 作成済みのため課金発生としてチェック済みです</p>` : ""}
  </div>`;
}

// 紙の指示書と同じ十字の歯式表記（選択歯を反転表示）
// teethTypes は { 歯: 種別 }。印刷（白黒）でも区別できるよう記号を数字の上に出す
function docTeethChart(teeth, types) {
  const set = new Set(teeth);
  const ty = t => (types && types[t]) || "unit";
  const cell = (q, n) => {
    const t = q + n, on = set.has(t);
    const sym = on ? TT[ty(t)].sym : "";
    return `<span class="dtc ${on ? "on d-" + ty(t) : ""}">${sym ? `<i class="dsym">${sym}</i>` : ""}${n}</span>`;
  };
  const row = (q1, q2) =>
    `<div class="dtc-row">${[8,7,6,5,4,3,2,1].map(n => cell(q1, n)).join("")}<span class="dtc-mid"></span>${[1,2,3,4,5,6,7,8].map(n => cell(q2, n)).join("")}</div>`;
  const used = [...new Set(teeth.map(ty))].filter(x => TT[x].sym);
  const legend = used.length
    ? `<div class="dtc-legend">${used.map(x => `${TT[x].sym} ${TT[x].label}`).join("　")}</div>` : "";
  return `<div class="dtc-wrap">${row("右上", "左上")}${row("右下", "左下")}${legend}</div>`;
}

  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  sigCtx = c.getContext("2d");
  sigCtx.scale(dpr, dpr);
  sigCtx.fillStyle = "#fff"; sigCtx.fillRect(0, 0, w, h);
  sigCtx.strokeStyle = "#1A237E"; sigCtx.lineWidth = 2.4; sigCtx.lineCap = "round"; sigCtx.lineJoin = "round";
  let last = null;
  c.addEventListener("pointerdown", e => { c.setPointerCapture(e.pointerId); last = [e.offsetX, e.offsetY]; });
  c.addEventListener("pointermove", e => {
    if (!last) return;
    sigCtx.beginPath(); sigCtx.moveTo(last[0], last[1]); sigCtx.lineTo(e.offsetX, e.offsetY); sigCtx.stroke();
    last = [e.offsetX, e.offsetY];
  });
  const end = () => { last = null; };
  c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
}

// 紙の指示書と同じ十字レイアウト。タップしやすいよう各象限を臼歯列/前歯列の2段に分ける
const ROWS_UPPER = [
  ["右上8","右上7","右上6","右上5","左上5","左上6","左上7","左上8"],
  ["右上4","右上3","右上2","右上1","左上1","左上2","左上3","左上4"],
];
const ROWS_LOWER = [
  ["右下4","右下3","右下2","右下1","左下1","左下2","左下3","左下4"],
  ["右下8","右下7","右下6","右下5","左下5","左下6","左下7","左下8"],
];
function odontogram(idx, it) {
  const teeth = it.teeth;
  const set = new Set(teeth);
  const active = it.paintType || "unit";
  const cell = t => {
    const on = set.has(t);
    const ty = toothType(it, t);
    return `<button type="button" class="tooth ${on ? "sel tt-" + ty : ""}" data-tooth="${esc(t)}" data-item="${idx}"
      aria-pressed="${on}" aria-label="${esc(t)}${on && TT[ty].sym ? " " + TT[ty].label : ""}">${t.slice(2)}${on && TT[ty].sym ? `<i class="tsym">${TT[ty].sym}</i>` : ""}</button>`;
  };
  const grid = row => `<div class="odn-grid">${row.map(cell).join("")}</div>`;
  const modes = `<div class="tt-modes">${TOOTH_TYPES.map(tt =>
    `<button type="button" class="${active === tt.id ? "on" : ""} m-${tt.id}" data-paint="${tt.id}" data-item="${idx}">${tt.sym ? tt.sym + " " : ""}${tt.label}</button>`).join("")}</div>`;
  const readout = sortTeeth(teeth).map(t =>
    `<span class="rt tt-${toothType(it, t)}">${esc(t)}${toothSym(it, t)}<button type="button" data-rm-tooth="${esc(t)}" data-item="${idx}" aria-label="${esc(t)}を外す">×</button></span>`).join("");
  return `<div class="odn" data-odn="${idx}">
    ${modes}
    <div class="odn-lbl"><span>右上</span><span>左上</span></div>
    <div class="odn-arch">${grid(ROWS_UPPER[0])}${grid(ROWS_UPPER[1])}</div>
    <div class="odn-arch">${grid(ROWS_LOWER[0])}${grid(ROWS_LOWER[1])}</div>
    <div class="odn-lbl bottom"><span>右下</span><span>左下</span></div>
    <div class="odn-readout">${readout || '<span style="font-size:12px;color:var(--muted)">上で種別を選んでから歯をタップ</span>'}
      ${teeth.length ? `<button type="button" class="odn-clear" data-clear-teeth="${idx}">クリア</button>` : ""}</div>
    <div class="odn-hint">種別を選んでからタップ／横になぞると連続歯を一気に指定できます（上下スクロールはそのまま使えます）</div>
  </div>`;
}

function apptWarning(d) {
  if (!d.apptDate) return "";
  let latest = null;
  for (const it of d.items) {
    if (!it.prosId) continue;
    const x = deliveryISO(d.shipDate || d.impressionDate, PRO[it.prosId], d.impressionDate);
    if (x && (!latest || x > latest)) latest = x;
  }
  if (latest && latest > d.apptDate) {
    return `<div class="alert warn"><span>⚠️</span><div>納期（${fmtJP(latest)}）が患者予約日（${fmtJP(d.apptDate)}）より後になります。予約日を見直すか、BFLに納期相談を。</div></div>`;
  }
  return "";
}

  if (el.dataset.role) { state.role = el.dataset.role; render(); return; }

  if (el.dataset.doc) { state.view = el.dataset.doc; render(); return; }

  if (el.dataset.fbRate) {
    if (fbDraft) {
      const cur = document.getElementById("f-fb-comment");
      if (cur) fbDraft.comment = cur.value; // 再描画前にコメントを退避
      fbDraft[el.dataset.fbRate] = Number(el.dataset.val);
      state.modal = feedbackModalHTML();
      render();
    }
    return;
  }

  if (el.dataset.impDia) {
    const it = draft && draft.items[Number(el.dataset.item)];
    if (it) {
      it.implant = it.implant || { maker: DEFAULT_IMPLANT_MAKER };
      it.implant.dia = it.implant.dia === el.dataset.impDia ? "" : el.dataset.impDia;
      render();
    }
    return;
  }

  if (el.dataset.paint) {
    const it = draft && draft.items[Number(el.dataset.item)];
    if (it) { it.paintType = el.dataset.paint; render(); }
    return;
  }

  if (el.dataset.tooth) {
    // キーボード操作（Enter/Space → e.detail===0）のみここで処理。ポインタはpointerdown側で処理済み
    if (e.detail === 0 && draft) {
      const it = draft.items[Number(el.dataset.item)];
      if (it) {
        const t = el.dataset.tooth, type = it.paintType || "unit";
        if (it.teeth.includes(t) && toothType(it, t) === type) {
          it.teeth = it.teeth.filter(x => x !== t);
          if (it.teethType) delete it.teethType[t];
        } else {
          if (!it.teeth.includes(t)) it.teeth.push(t);
          it.teethType = it.teethType || {}; it.teethType[t] = type;
        }
        syncQty(it); render();
      }
    }
    return;
  }

  if (el.dataset.nav) {
    state.view = el.dataset.nav;
    if (state.view === "new" && !draft) draft = newDraft();
    render(); return;
  }
  if (el.dataset.clinic) { state.clinic = el.dataset.clinic; state.filter = "all"; render(); return; }
  if (el.dataset.filter != null) { state.filter = el.dataset.filter === "all" ? "all" : Number(el.dataset.filter); render(); return; }
  if (el.dataset.open) { state.view = "detail"; state.orderNo = el.dataset.open; render(); return; }

  if (el.dataset.statusTo != null) {
    const o = findOrder(state.orderNo); if (!o) return;
    const to = Number(el.dataset.statusTo);
    applyStatus(o, to);
    // セット完了時はフィードバック入力 →（保証対象なら）署名パッドの順に開く
    if (to === 6) openFeedback(o);
    showToast(`${ST[to].name} に更新しました`, () => { undoLast(o, "元に戻す"); render(); });
    return;
  }
  if (el.dataset.draftClinic) { draft.clinic = el.dataset.draftClinic; draft.doctor = ""; render(); return; }
  if (el.dataset.cat) {
    const it = draft.items[Number(el.dataset.item)];
    if (it.cat !== el.dataset.cat) { it.cat = el.dataset.cat; it.prosId = null; }
    render(); return;
  }
  if (el.dataset.shade) {
    const it = draft.items[Number(el.dataset.item)];
    it.shade = it.shade === el.dataset.shade ? "" : el.dataset.shade;
    render(); return;
  }
  if (el.dataset.rmItem != null) { draft.items.splice(Number(el.dataset.rmItem), 1); render(); return; }
  if (el.dataset.rmTooth) {
    const it = draft.items[Number(el.dataset.item)];
    it.teeth = it.teeth.filter(t => t !== el.dataset.rmTooth);
    syncQty(it); render(); return;
  }
  if (el.dataset.clearTeeth != null) {
    const it = draft.items[Number(el.dataset.clearTeeth)];
    it.teeth = []; syncQty(it); render(); return;
  }
  if (el.dataset.showTeeth != null) {
    draft.items[Number(el.dataset.showTeeth)].forceTeeth = true;
    render(); return;
  }

  switch (el.dataset.act) {
    case "toggle-search": state.searchOpen = !state.searchOpen; if (!state.searchOpen) state.search = ""; render(); break;
    case "status-help": state.modal = statusHelpHTML(); render(); break;
    case "go-home": state.view = "home"; render(); break;
    case "go-detail": state.view = "detail"; render(); break;
    case "print-doc": printDoc(); break;
    case "print-help": state.modal = printHelpHTML(); render(); break;
    case "open-sig": state.modal = sigModalHTML(); render(); break;
    case "sig-clear": {
      const c = $("#sig-pad");
      if (c && sigCtx) { sigCtx.fillStyle = "#fff"; sigCtx.fillRect(0, 0, c.clientWidth, c.clientHeight); }
      break;
    }
    case "sig-later": state.modal = null; render(); break;
    case "fb-open": {
      const o = findOrder(state.orderNo); if (!o) return;
      openFeedback(o); render(); break;
    }
    case "fb-later": {
      const o = findOrder(state.orderNo);
      if (o) maybeOpenSig(o); else state.modal = null;
      render(); break;
    }
    case "fb-save": {
      const o = findOrder(state.orderNo); if (!o) return;
      o.feedback = { ...fbDraft, at: o.feedback?.at || todayISO() };
      save();
      maybeOpenSig(o);
      render();
      showToast("フィードバックを保存しました");
      break;
    }
    case "sig-save": {
      const c = $("#sig-pad");
      const o = findOrder(state.orderNo);
      if (c && o) { o.signature = c.toDataURL("image/png"); o.signedAt = todayISO(); save(); }
      state.modal = null; render();
      showToast("署名を保存しました。保証書から印刷・PDF保存できます");
      break;
    }
    case "add-item": draft.items.push({ prosId: null, cat: null, teeth: [], shade: "", qty: 1, photoInDrive: false }); render(); break;
    case "save-order": saveOrder(); break;
    case "status-back": {
      const o = findOrder(state.orderNo); if (!o || !o.undoStack.length) return;
      const cur = o.status;
      undoLast(o);
      showToast(`${ST[cur].short} → ${ST[o.status].short} に戻しました`);
      break;
    }
    case "resend": reasonDraft = { reason: "", comment: "", chargeable: false }; state.modal = reasonModalHTML("resend"); render(); break;
    case "cancel-order": reasonDraft = { reason: "", comment: "", chargeable: false }; state.modal = reasonModalHTML("cancel"); render(); break;
    case "reason-pick": reasonDraft.reason = el.dataset.val; state.modal = reasonModalHTML(el.dataset.kind); render(); break;
    case "reason-charge": reasonDraft.chargeable = !reasonDraft.chargeable; state.modal = reasonModalHTML(el.dataset.kind); render(); break;
    case "reason-ok": {
      const o = findOrder(state.orderNo); if (!o) return;
      const kind = el.dataset.kind;
      const label = reasonDraft.reason === "その他" ? (reasonDraft.comment || "その他") : reasonDraft.reason;
      const note = `理由: ${label}${reasonDraft.chargeable ? "／作成済みのため課金発生" : "／課金なし"}`;
      o.chargeable = reasonDraft.chargeable;
      if (kind === "resend") { o.resendReason = label; applyStatus(o, 99, note); }
      else { o.cancelReason = label; applyStatus(o, 98, note); }
      state.modal = null;
      showToast(`${ST[kind === "resend" ? 99 : 98].name} にしました`, () => { undoLast(o, "元に戻す"); render(); });
      break;
    }
    case "toast-undo": {
      const fn = state.toast?.undoFn; state.toast = null; state.modal = null;
      if (toastTimer) clearTimeout(toastTimer);
      if (fn) fn(); else render();
      break;
    }
    case "reset-demo": {
      db = { seedVersion: SEED_VERSION, orders: seedOrders() };
      db.orders.forEach(migrate); save();
      showToast("デモデータをリセットしました");
      break;
    }
  }

  if (el.dataset.modal) {
    if (el.dataset.modal === "close") {
      // 背景は背景自体をタップしたときのみ閉じる（モーダル内の誤タップで閉じない）
      if (!el.classList.contains("modal-bg") || e.target === el) { state.modal = null; render(); }
    }
    return;
  }
});

// 歯式: タップ + なぞり選択（touch-action:pan-yで上下スクロールと共存）
let painting = null; // {item, mode, snapshot}
function toothApply(cell) {
  if (!painting) return;
  const idx = Number(cell.dataset.item), tooth = cell.dataset.tooth;
  if (idx !== painting.item) return;
  const it = draft.items[idx];
  const has = it.teeth.includes(tooth);
  if (painting.mode) {
    if (!has) it.teeth.push(tooth);
    it.teethType = it.teethType || {};
    it.teethType[tooth] = painting.type;
  } else if (has) {
    it.teeth = it.teeth.filter(t => t !== tooth);
    if (it.teethType) delete it.teethType[tooth];
  }
}
document.addEventListener("pointerdown", (e) => {
  const cell = e.target.closest(".tooth");
  if (!cell || !draft) return;
  const idx = Number(cell.dataset.item);
  const it = draft.items[idx];
  if (!it) return;
  const tooth = cell.dataset.tooth;
  const type = it.paintType || "unit";
  // 同じ種別で既に指定済みの歯をタップしたら解除。別種別なら種別を付け替える
  const sameType = it.teeth.includes(tooth) && toothType(it, tooth) === type;
  painting = { item: idx, type, mode: !sameType, snapshot: [...it.teeth], snapshotType: { ...(it.teethType || {}) } };
  toothApply(cell);
  render();
});
document.addEventListener("pointermove", (e) => {
  if (!painting) return;
  const cell = document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".tooth");
  if (cell) toothApply(cell);
});
document.addEventListener("pointerup", () => {
  if (!painting) return;
  const it = draft && draft.items[painting.item];
  painting = null;
  if (it) { syncQty(it); render(); }
});
// スクロールにジェスチャを奪われたら、このジェスチャで触った選択を元に戻す（誤選択防止）
document.addEventListener("pointercancel", () => {
  if (!painting) return;
  const it = draft && draft.items[painting.item];
  if (it) { it.teeth = painting.snapshot; it.teethType = painting.snapshotType; }
  painting = null;
  render();
});
function syncQty(it) { if (it.teeth.length) it.qty = it.teeth.length; }

// フォーム入力（テキストはdraftへ、再描画なし）
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "search-in") {
    // 入力欄は作り直さず一覧とチップだけ更新（IME変換・カーソル位置を壊さない）
    state.search = t.value;
    const orders = homeFiltered();
    const chipsEl = document.getElementById("home-chips");
    const listEl = document.getElementById("home-list");
    if (chipsEl) chipsEl.innerHTML = homeChipsHTML(orders);
    if (listEl) listEl.innerHTML = homeCardsHTML(orders);
    return;
  }
  if (t.id === "f-fb-comment" && fbDraft) { fbDraft.comment = t.value; return; }
  if (t.id === "f-reason-comment") { reasonDraft.comment = t.value; return; }
  if (t.id === "b-note") { const o = findOrder(state.orderNo); if (o) { o.bflNote = t.value; save(); } return; }
  if (t.dataset.impfree != null) {
    const it = draft.items[Number(t.dataset.item)];
    if (it) { it.implant = it.implant || {}; it.implant[t.dataset.impfree + "Free"] = t.value; }
    return;
  }
  if (t.dataset.impnote != null) {
    const it = draft.items[Number(t.dataset.impnote)];
    if (it) { it.implant = it.implant || {}; it.implant.note = t.value; }
    return;
  }
  if (t.id === "drive-q") {
    state.driveQ = t.value;
    const btn = document.querySelector('a.btn.primary[href^="#demo-no-link"]');
    if (btn) btn.href = driveSearch(t.value);
    return;
  }
  if (t.id === "noki-search") {
    // 入力欄を作り直さず表だけ差し替える（IME・カーソル位置を壊さない）
    state.nokiSearch = t.value;
    const tbody = document.querySelector(".noki-table tbody");
    if (tbody) tbody.innerHTML = nokiRowsHTML();
    return;
  }
  if (!draft && t.id !== "noki-ship") return;
  switch (t.id) {
    case "f-karte": draft.karte = t.value; return;
    case "f-patient": draft.patient = t.value; return;
    case "f-note": draft.note = t.value; return;
  }
  if (t.dataset.qty != null) {
    const it = draft.items[Number(t.dataset.qty)];
    it.qty = Math.max(1, Number(t.value) || 1);
    const amt = document.querySelector(`[data-amount="${t.dataset.qty}"]`);
    if (amt) amt.innerHTML = amountLabel(draft, it);
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "noki-ship") { state.nokiShip = t.value || todayISO(); render(); return; }
  if (t.id === "sort-by") { state.sortBy = t.value; render(); return; }
  if (t.id === "tech-filter") { state.techFilter = t.value; render(); return; }
  if (t.dataset && t.dataset.fbPhoto != null && fbDraft) { fbDraft.photoInDrive = t.checked; return; }
  // BFL設定（納品日・担当技工士）
  if (t.id === "b-due" || t.id === "b-tech") {
    const o = findOrder(state.orderNo);
    if (o) { if (t.id === "b-due") o.bflDueDate = t.value; else o.technician = t.value; save(); render(); }
    return;
  }
  if (!draft) return;
  if (t.dataset.imp != null) {
    const it = draft.items[Number(t.dataset.item)];
    if (it) {
      it.implant = it.implant || {};
      it.implant[t.dataset.imp] = t.value;
      // メーカーを変えたら別システムの種類・径が残らないようクリアする
      if (t.dataset.imp === "maker") { it.implant.kind = ""; it.implant.dia = ""; it.implant.diaFree = ""; }
      render();
    }
    return;
  }
  switch (t.id) {
    case "f-doctor": draft.doctor = t.value; return;
    case "f-imp": draft.impressionDate = t.value; render(); return;
    case "f-ship": draft.shipDate = t.value; render(); return;
    case "f-appt": draft.apptDate = t.value; render(); return;
    case "f-rush": draft.rush = t.checked; render(); return;
    case "f-drcheck": draft.drChecked = t.checked; render(); return;
  }
  if (t.dataset.pros != null) {
    const it = draft.items[Number(t.dataset.pros)];
    it.prosId = t.value ? Number(t.value) : null;
    render(); return;
  }
  if (t.dataset.photo != null) {
    const it = draft.items[Number(t.dataset.photo)];
    it.photoInDrive = t.checked;
    // 写真あり運用と矛盾しないよう、シェード未選択なら「写真あり」を自動セット
    if (t.checked && !it.shade) { it.shade = "写真あり"; render(); }
    return;
  }
});
// ---------- 保存 ----------
function saveOrder() {
  const d = draft;
  const errs = [];
  if (!d.karte.trim()) errs.push("カルテ番号");
  if (!d.patient.trim()) errs.push("患者名");
  if (!d.doctor) errs.push("担当医");
  if (!d.items.length || d.items.some(it => !it.prosId)) errs.push("補綴物の選択");
  const missTeeth = d.items.filter(it => it.prosId && !PRO[it.prosId].noTeeth && !it.teeth.length);
  if (errs.length) { showToast(`未入力: ${errs.join("・")}`); return; }
  if (missTeeth.length && !confirm("部位（歯式）が未選択の技工物があります。このまま登録しますか？")) return;
  const photoMismatch = d.items.some(it => it.prosId && it.shade === "写真あり" && !it.photoInDrive);
  if (photoMismatch && !confirm("シェード「写真あり」の技工物に「シェード写真はDriveにあり」のチェックがありません。このまま登録しますか？")) return;
  if (!d.drChecked && !confirm("「Dr確認済み」のチェックがありません。このまま登録しますか？")) return;

  const dateKey = todayISO().replaceAll("-", "");
  const seq = db.orders.filter(o => o.no.startsWith(dateKey)).length + 1;
  const no = `${dateKey}-${String(seq).padStart(4, "0")}`;
  db.orders.unshift({
    no, clinic: d.clinic, doctor: d.doctor, karte: d.karte.trim(), patient: d.patient.trim(),
    items: d.items.map(it => ({ prosId: it.prosId, teeth: sortTeeth(it.teeth), teethType: { ...(it.teethType || {}) },
      shade: it.shade, qty: it.qty, photoInDrive: it.photoInDrive, implant: it.implant ? { ...it.implant } : null })),
    note: d.note.trim(), impressionDate: d.impressionDate, shipDate: d.shipDate,
    apptDate: d.apptDate, rush: d.rush,
    drChecked: d.drChecked, drCheckedBy: d.drChecked ? d.doctor : "", drCheckedAt: d.drChecked ? todayISO() : "",
    status: 0, dates: {}, history: [], undoStack: [],
  });
  save();
  draft = null;
  state.view = "detail"; state.orderNo = no; state.clinic = d.clinic; state.filter = "all";
  render();
  showToast(`発注 ${no} を登録しました（${ST[0].short}）`);
}

// ---------- 起動 ----------
render();
</script>
